<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星图 · 定位</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#edf0eb;color:#1d2b26;font-family:'DM Sans',"Noto Sans SC",sans-serif}#map{position:absolute;inset:0;z-index:0; background:#dfe8df}.leaflet-control-zoom{border:0!important;box-shadow:0 5px 25px #203b2920!important}.leaflet-control-zoom a{border:0!important;border-radius:8px!important;margin:5px;color:#2c4435!important}.leaflet-bottom.leaflet-right{font-size:9px}.panel{position:absolute;z-index:500;left:28px;top:28px;bottom:28px;width:365px;background:#fbfcf9;border:1px solid #ffffffbd;border-radius:20px;box-shadow:0 20px 70px #243b2c25;display:flex;flex-direction:column;overflow:hidden}.header{padding:27px 27px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9ede6}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:.08em}.logo{width:36px;height:36px;border-radius:12px;background:#1c503b;color:#e1f8df;display:grid;place-items:center;font-size:22px}.badge{font-size:11px;color:#61786a;background:#eef3eb;border-radius:30px;padding:7px 10px}.body{padding:28px 27px;flex:1;overflow:auto}.eyebrow{color:#7c9888;font-size:10px;font-weight:700;letter-spacing:.18em}.title{font-size:29px;letter-spacing:-.06em;line-height:1.2;margin:12px 0 8px;font-weight:600}.desc{color:#8b9a8f;font-size:13px;line-height:1.7;margin:0 0 24px}.search{display:flex;border:1px solid #e3eae1;border-radius:12px;background:white;padding:5px;box-shadow:0 3px 12px #1a3b2410}.search input{width:100%;border:0;outline:0;padding:11px;font-size:13px;background:transparent}.search button{border:0;border-radius:8px;background:#eef4eb;padding:0 14px;color:#305940;cursor:pointer}.results{background:white;border-radius:10px;max-height:180px;overflow:auto}.result{padding:10px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f2ee}.result:hover{background:#f1f6ef}.section{margin-top:29px}.section-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.subtle{color:#a0afa3;font-size:11px;font-weight:400}.coordinate{margin-top:12px;padding:16px;background:#f1f5ef;border-radius:13px;display:flex;justify-content:space-between}.coordinate small{display:block;color:#97a79a;font-size:10px;margin-bottom:6px}.coordinate span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.hint{font-size:12px;color:#9ba99e;margin:12px 0 0}.primary,.secondary{width:100%;border:0;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;padding:15px}.primary{background:#235d43;color:#fff;margin-top:27px;box-shadow:0 8px 20px #235d4328}.primary:hover{background:#194d36}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{margin-top:9px;background:#f0f4ee;color:#6b8071}.footer{padding:20px 27px;border-top:1px solid #e9ede6}.device{display:flex;gap:11px;align-items:center}.device-icon{width:37px;height:37px;border-radius:11px;background:#edf3eb;display:grid;place-items:center;font-size:19px}.device strong{font-size:12px;display:block}.device small{color:#9ba99e;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#aebbb1;margin-left:auto}.dot.on{background:#63a878;box-shadow:0 0 0 4px #63a87820}.toast{position:absolute;z-index:500;right:28px;top:28px;background:#fff;border-radius:12px;padding:13px 17px;box-shadow:0 8px 30px #203b2920;font-size:12px;color:#536b5b}.pin{width:26px;height:26px;background:#275f45;border:5px solid white;border-radius:50%;box-shadow:0 3px 14px #194b3580}.leaflet-top.leaflet-right{top:auto;bottom:35px;right:20px}@media(max-width:700px){.panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;height:auto;max-height:54vh}.header{padding:14px 18px}.body{padding:16px 18px}.title{font-size:22px;margin:6px 0}.desc{margin-bottom:10px}.section{margin-top:14px}.primary{margin-top:12px}.footer{padding:12px 18px}.toast{top:12px;right:12px}.leaflet-top.leaflet-right{bottom:56vh}}
</style></head><body><div id="map"></div><div class="toast" id="toast">在地图上点击，选择目的地</div><aside class="panel"><div class="header"><div class="brand"><span class="logo">✳</span>星图定位</div><span class="badge">LOCATION STUDIO</span></div><div class="body"><div class="eyebrow">EXPLORE SOMEWHERE NEW</div><h1 class="title">下一站，去哪里？</h1><p class="desc">在地图上选一个点，让你的 iPhone<br>暂时出现在另一个地方。</p><div class="search"><input id="search" placeholder="搜索城市、地标或地址" autocomplete="off"><button id="searchBtn">搜索</button></div><div class="results" id="results"></div><div class="section"><div class="section-head">已选位置 <span class="subtle">点击地图更换</span></div><div class="coordinate"><div><small>纬度 LATITUDE</small><span id="lat">—</span></div><div><small>经度 LONGITUDE</small><span id="lon">—</span></div></div><p class="hint" id="hint">选择地点后即可开始模拟</p></div><button class="primary" id="start" disabled>开始模拟定位 ↗</button><button class="secondary" id="stop">停止并恢复真实定位</button></div><div class="footer"><div class="device"><span class="device-icon">♧</span><div><strong id="device">正在检查设备</strong><small id="status">请保持 iPhone 连接</small></div><span class="dot" id="dot"></span></div></div></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id);let selected=null,marker=null;const map=L.map('map',{zoomControl:false}).setView([40.758,-73.9855],11);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);function select(lat,lon,pan=false){selected={lat,lon};$('lat').textContent=lat.toFixed(5);$('lon').textContent=lon.toFixed(5);$('start').disabled=false;if(marker)marker.remove();marker=L.marker([lat,lon],{icon:L.divIcon({className:'pin',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);if(pan)map.setView([lat,lon],13);$('toast').textContent='位置已选择，可以开始模拟';}map.on('click',e=>select(e.latlng.lat,e.latlng.lng));async function call(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data||{})});let j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j} $('start').onclick=async()=>{if(!selected)return;$('start').disabled=true;$('hint').textContent='正在连接设备…';try{await call('/set',selected);$('toast').textContent='正在发送模拟位置，请在手机地图确认';await refresh()}catch(e){$('hint').textContent=e.message}finally{$('start').disabled=false}};$('stop').onclick=async()=>{ $('stop').disabled=true;try{let result=await call('/stop');$('toast').textContent=result.cleared?'已停止模拟定位':'已停止循环；如位置未恢复请重启 iPhone';await refresh()}catch(e){$('toast').textContent=e.message}finally{$('stop').disabled=false}};async function refresh(){try{let s=await(await fetch('/status')).json();$('device').textContent=s.connected?'iPhone 已连接':'未检测到 iPhone';$('dot').className='dot '+(s.connected?'on':'');$('status').textContent=s.running?(s.phase==='sending'?'循环维持中':s.phase==='retrying'?'连接中断，正在重试':'正在连接设备'):'请保持 iPhone 连接';$('hint').textContent=s.running?(s.phase==='sending'?'每 5 秒更新位置，请在手机地图确认':s.phase==='retrying'?'连接中断，5 秒后自动重试':'正在连接设备…'):'选择地点后即可开始模拟';if(s.running&&s.location&&!selected)select(s.location.lat,s.location.lon,true);if(s.running&&s.phase==='retrying')$('hint').textContent='连接中断，正在自动重试；请检查数据线'}catch(e){$('device').textContent='服务未连接'}}setInterval(refresh,4000);refresh();async function search(){let q=$('search').value.trim();if(!q)return;$('results').innerHTML='<div class="result">正在搜索…</div>';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q)+'&accept-language=zh-CN');let a=await r.json();$('results').replaceChildren();if(!a.length)$('results').textContent='没有找到地点';a.forEach(x=>{let el=document.createElement('div');el.className='result';el.textContent=x.display_name;el.onclick=()=>{select(+x.lat,+x.lon,true);$('search').value=x.display_name;$('results').replaceChildren()};$('results').append(el)})}catch(e){$('results').textContent='搜索失败，请检查网络'}}$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};
</script></body></html>
